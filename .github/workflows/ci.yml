name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI: Bevy debug symbols are multi-GB and slow to link.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  desktop:
    name: Desktop (fmt, clippy, tests, native QA)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (desktop)
        run: cargo test -p defend_taipei --lib

      - name: cargo build (desktop)
        run: cargo build -p defend_taipei --bin defend-taipei

      - name: Native GPU screenshots and save/continue flow
        env:
          DEFEND_TAIPEI_QA_OUT: ${{ github.workspace }}/native-qa
          DEFEND_TAIPEI_SAVE_DIR: ${{ runner.temp }}/defendtaipei-qa-save
          DEFEND_TAIPEI_PERF: "0"
          BEVY_ASSET_ROOT: ${{ github.workspace }}/game
        run: |
          export VK_ICD_FILENAMES="$(python3 -c 'from pathlib import Path; paths=sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json")); print(paths[0] if paths else "")')"
          test -n "$VK_ICD_FILENAMES"
          timeout 900s target/debug/defend-taipei --qa > native-qa.log 2>&1
          python3 -c 'import json; report=json.load(open("native-qa/qa-report.json")); assert report["success"], report; assert len(report["captures"]) == 11, report'

      - name: Upload native QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-qa
          path: |
            native-qa/
            native-qa.log
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Rust library (.so) with cargo-ndk
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -P 31 -o android/app/src/main/jniLibs \
            build --release -p defend_taipei_android

      - name: Package debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DefendTaipei-arm64-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DefendTaipei-arm64-debug-apk
          path: DefendTaipei-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30

  # x86_64 APK + emulator smoke. Production APK stays arm64-only (job above);
  # hosted runners speak x86_64, so we build a second ABI for CI only.
  # Vulkan via SwiftShader (`-gpu swiftshader_indirect`). Both runtime startup
  # and real touch/save/orientation checks must pass; this is a required job.
  emulator:
    name: Emulator gameplay (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Independent of the arm64 APK job; builds its own x86_64 package for the emulator.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-x86_64

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Rust library (.so) x86_64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK: $ANDROID_NDK_HOME"
          cargo ndk -t x86_64 -P 31 -o android/app/src/main/jniLibs \
            build --release -p defend_taipei_android

      - name: Package x86_64 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PABI_FILTERS=x86_64
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/DefendTaipei-x86_64-debug.apk"

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: DefendTaipei-x86_64-debug-apk
          path: DefendTaipei-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-google_apis

      - name: Create AVD snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD ready"

      - name: Emulator launch and touch gameplay
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner runs each line as its own `sh -c`, so keep
          # this as a single line (no backslash continuations).
          script: chmod +x scripts/emulator-smoke.sh scripts/emulator-gameplay-smoke.sh && SMOKE_SECS=45 SMOKE_OUT="$GITHUB_WORKSPACE/emulator-smoke" ./scripts/emulator-smoke.sh "$GITHUB_WORKSPACE/DefendTaipei-x86_64-debug.apk" && GAMEPLAY_SMOKE_OUT="$GITHUB_WORKSPACE/emulator-gameplay-smoke" ./scripts/emulator-gameplay-smoke.sh "$GITHUB_WORKSPACE/DefendTaipei-x86_64-debug.apk"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            emulator-smoke/
            emulator-gameplay-smoke/
          if-no-files-found: warn
          retention-days: 14
