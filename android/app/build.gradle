plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'tw.lijiabao.defendtaipei'
    compileSdk 34

    defaultConfig {
        applicationId "tw.lijiabao.defendtaipei"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        // Default: phone APK is arm64-only. CI emulator smoke passes
        // -PABI_FILTERS=x86_64 so the same project can produce an x86_64 APK.
        ndk {
            abiFilters = (project.findProperty('ABI_FILTERS') ?: 'arm64-v8a')
                    .toString()
                    .split(',')
                    .collect { it.trim() }
                    .findAll { it }
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            // Compress the ~100 MB Rust library inside the APK (much smaller download).
            useLegacyPackaging true
        }
    }
    buildFeatures {
        prefab true
    }
    // Rust code is built separately by cargo-ndk into app/src/main/jniLibs (see README / CI).
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
